<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WE ROOF · Record a door</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B5361F}a:hover{color:#8C2715}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E9E4D9; color: #1E1B18; font-family: 'Instrument Sans', system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; overflow: hidden; position: relative;">
  <div aria-hidden="true" style="position: absolute; inset: 0 0 auto 0; height: 120px; overflow: hidden;">
    <div style="position: absolute; left: 0; top: 64px; width: 390px; height: 18px; background: #FFFFFF;"></div>
    <div style="position: absolute; left: 150px; top: 0; width: 18px; height: 120px; background: #FFFFFF;"></div>
    <div style="position: absolute; left: 186px; top: 30px; width: 30px; height: 22px; border-radius: 4px; background: #DAD3C6;"></div>
    <div style="position: absolute; left: 236px; top: 30px; width: 30px; height: 22px; border-radius: 4px; background: #DAD3C6;"></div>
    <div style="position: absolute; left: 90px; top: 30px; width: 30px; height: 22px; border-radius: 4px; background: #DAD3C6;"></div>
    <div style="position: absolute; left: 192px; top: 26px; width: 18px; height: 18px; border-radius: 50%; background: #B5361F; border: 3px solid #FFFFFF; box-shadow: 0 0 0 6px rgba(181,54,31,0.25);"></div>
    <div style="position: absolute; inset: 0; background: rgba(26,24,22,0.45);"></div>
  </div>
  <div style="height: 64px; flex-shrink: 0;"></div>
  <section aria-labelledby="addr" style="position: relative; flex: 1; background: #F6F3EC; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -12px 30px rgba(0,0,0,0.2);">
    <div style="display: grid; place-items: center; padding-top: 8px;"><span style="width: 40px; height: 5px; border-radius: 3px; background: #CFC8BB;"></span></div>
    <div style="padding: 8px 20px 14px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #B5361F;">RECORD A DOOR</div>
        <h1 id="addr" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 34px; line-height: 1; font-weight: 700;">1418 Maple Street</h1>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
          <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; color: #1B4E3B; background: #E3F0E8; padding: 4px 9px; border-radius: 20px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>GPS ±6 m · 9 m away</span>
          <span style="font-size: 12px; font-weight: 700; color: #36322D; background: #ECE7DE; padding: 4px 9px; border-radius: 20px;">Oakwood Heights</span>
        </div>
      </div>
      <a href="Field.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: #ECE7DE; display: grid; place-items: center; color: #1E1B18; text-decoration: none; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>

    <div style="flex: 1; overflow: auto; padding: 0 20px 14px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; gap: 12px; align-items: center; background: #FFFFFF; border: 1px solid #E2DDD3; border-radius: 12px; padding: 10px 12px;">
        <span style="width: 32px; height: 32px; border-radius: 9px; background: #ECE7DE; display: grid; place-items: center; flex-shrink: 0;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#36322D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg></span>
        <div style="font-size: 13px; line-height: 1.4;"><strong>Last visit Oct 3</strong><br><span style="color: #5F5951;">No answer · Jordan D.</span></div>
      </div>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column;">
        <legend style="font-size: 15px; font-weight: 700; padding: 0; margin-bottom: 10px;">What happened at the door?</legend>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <sc-for list="{{options}}" as="o" hint-placeholder-count="7">
            <button aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}"><span style="{{o.swatch}}">{{o.mark}}</span><span style="flex: 1; text-align: left;">{{o.label}}</span></button>
          </sc-for>
        </div>
      </fieldset>

      <sc-if value="{{isFollow}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="font-size: 14px; font-weight: 700;">Follow up on</div>
          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <span style="min-height: 44px; padding: 0 16px; border-radius: 22px; background: #1E1B18; color: #FFFFFF; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center;">Tomorrow</span>
            <span style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #CFC8BB; background: #FFFFFF; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center;">Fri Oct 9</span>
            <span style="min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #CFC8BB; background: #FFFFFF; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center;">Pick date</span>
          </div>
        </div>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="notes" style="font-size: 14px; font-weight: 700;">Field notes <span style="font-weight: 500; color: #5F5951;">(optional)</span></label>
        <textarea id="notes" rows="2" placeholder="Roof condition, best time, who answered" style="border: 1.5px solid #CFC8BB; border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; background: #FFFFFF; color: #1E1B18; resize: none;"></textarea>
      </div>
    </div>

    <div style="padding: 12px 20px 30px; background: #FFFFFF; border-top: 1px solid #E2DDD3; display: flex; flex-direction: column; gap: 8px;">
      <a href="{{cta.href}}" style="{{cta.style}}">{{cta.label}}<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
      <div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #5F5951;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>Saves on your phone first. Sends when you have signal.</div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 'interested' }; }
  renderVals() {
    var self = this;
    var defs = [
      ['no_answer', '#64748b', 'No answer', '', '#F0F2F5'], ['not_interested', '#a36547', 'Not interested', '', '#F6EEE9'],
      ['follow_up', '#b27708', 'Follow-up', '', '#FCF3E1'], ['interested', '#147b70', 'Interested', '', '#E4F3F0'],
      ['inspection_requested', '#345bd6', 'Inspection', '', '#EDF1FC'], ['existing_customer', '#7b52aa', 'Existing customer', '', '#F2EDF8'],
      ['do_not_knock', '#bd3e3e', 'Do not knock', '×', '#FBECEC']
    ];
    var options = defs.map(function (d) {
      var on = self.state.pick === d[0];
      return {
        label: d[2], mark: on ? '✓' : d[3], pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ pick: d[0] }); },
        style: 'min-height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-radius: 14px; font-size: 15px; font-weight: ' + (on ? '700' : '600') + '; color: #1E1B18; background: ' + (on ? d[4] : '#FFFFFF') + '; border: ' + (on ? '2px solid ' + d[1] : '1.5px solid #DCD6CB') + '; box-shadow: ' + (on ? '0 4px 12px -4px ' + d[1] + '66' : '0 1px 0 rgba(0,0,0,0.04)') + ';' + (d[0] === 'do_not_knock' ? ' grid-column: span 2;' : ''),
        swatch: 'width: 24px; height: 24px; flex-shrink: 0; border-radius: ' + (d[0] === 'do_not_knock' ? '6px' : '50%') + '; background: ' + d[1] + '; color: #FFFFFF; font-size: 14px; font-weight: 700; display: grid; place-items: center; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);'
      };
    });
    var p = this.state.pick;
    var lead = p === 'interested' || p === 'inspection_requested';
    var btn = function (bg) { return 'min-height: 60px; border-radius: 16px; background: ' + bg + '; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), 0 8px 18px -6px ' + bg + ';'; };
    var cta = lead
      ? { href: 'Lead.dc.html', label: 'Next: homeowner details', style: btn('#B5361F') }
      : p === 'do_not_knock'
        ? { href: 'Field.dc.html', label: 'Mark do not knock', style: btn('#8C2715') }
        : { href: 'Field.dc.html', label: 'Save door', style: btn('#B5361F') };
    return { options: options, isFollow: p === 'follow_up', cta: cta };
  }
}
</script>
</body>
</html>
