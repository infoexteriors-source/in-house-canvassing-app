    <div style="position: absolute; left: 124px; top: 383px; font-size: 10px; font-weight: 700; color: #7A7268; letter-spacing: 1.4px;">WILLOW LANE</div>
    <sc-for list="{{pins}}" as="p" hint-placeholder-count="24">
      <a href="{{p.href}}" aria-label="{{p.label}}" style="{{p.hit}}"><span style="{{p.style}}">{{p.mark}}</span></a>
    </sc-for>
    <div style="position: absolute; left: 146px; top: 178px; width: 72px; height: 72px; border-radius: 50%; background: rgba(52,91,214,0.12); border: 1px solid rgba(52,91,214,0.3);"></div>
    <span class="wr-pulse" style="position: absolute; left: 172px; top: 204px; width: 20px; height: 20px; border-radius: 50%; background: rgba(52,91,214,0.5);"></span>
    <div aria-label="Your location" style="position: absolute; left: 171px; top: 203px; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; background: #345BD6; border: 3.5px solid #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.35);"></div>

    <div style="position: absolute; left: 14px; top: 14px; display: flex; gap: 8px;">
      <span style="display: inline-flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 12px; padding: 8px 12px; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,0.12);"><span><strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">38</strong> doors</span><span style="width: 1px; height: 18px; background: #E3DED4;"></span><span><strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 20px;">4</strong> leads</span></span>
    </div>
    <div style="position: absolute; right: 14px; top: 14px; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,0.12);">
      <button aria-label="Center on my location" style="width: 48px; height: 48px; background: transparent; border: 0; border-bottom: 1px solid #EDE8E0; display: grid; place-items: center; color: #345BD6;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3 3 10.5l7.5 3 3 7.5z"></path></svg></button>
      <button aria-label="Map key" style="width: 48px; height: 48px; background: transparent; border: 0; display: grid; place-items: center; color: #1E1B18;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 10 5-10 5L2 7z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg></button>
    </div>

    <div style="position: absolute; left: 12px; right: 12px; bottom: 12px; background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.18);">

      </div>
      <a href="Record.dc.html" style="min-height: 60px; border-radius: 10px; background: #B23A21; color: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
        <span style="width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.16); display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.2;"><span style="font-size: 17px; font-weight: 700;">Record door here</span><span style="font-size: 12px; opacity: 0.85;">Nearest: 1418 Maple St · 9 m</span></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
    </div>
  </div>

  <nav aria-label="Field app" style="display: flex; gap: 4px; background: #FFFFFF; border-top: 1px solid #E3DED4; padding: 6px 8px 24px;">
    <a href="Field.dc.html" aria-current="page" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 12px; font-weight: 700; color: #B23A21;"><span style="width: 56px; height: 30px; border-radius: 15px; background: #FBEDE8; display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"></path><path d="M9 3v15M15 6v15"></path></svg></span>Map</a>

    <a href="Hours.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 12px; font-weight: 600; color: #625C54;"><span style="width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>Hours</a>
    <a href="Sync.dc.html" style="flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 12px; font-weight: 600; color: #625C54;"><span style="position: relative; width: 56px; height: 30px; border-radius: 15px; display: grid; place-items: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M21 3v5h-5"></path><path d="M3 21v-5h5"></path></svg><span style="position: absolute; top: -2px; right: 6px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 9px; background: #B23A21; color: #FFFFFF; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid #FFFFFF;">3</span></span>Sync</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { onBreak: false }; }
  renderVals() {
    var self = this, b = this.state.onBreak;
    var OC = {
      no_answer: ['#64748b', 'No answer', ''], not_interested: ['#a36547', 'Not interested', ''], follow_up: ['#b27708', 'Follow-up', ''],
      interested: ['#147b70', 'Interested', ''], inspection_requested: ['#345bd6', 'Inspection', ''], existing_customer: ['#7b52aa', 'Customer', ''], do_not_knock: ['#bd3e3e', 'Do not knock', '×']
    };
    var road = ' background: #FFFFFF; box-shadow: 0 0 0 1px #D8D1C4;';
    var roads = [110, 246, 380].map(function (y) { return 'position: absolute; left: 0; top: ' + y + 'px; width: 390px; height: 18px;' + road; })
      .concat([96, 290].map(function (x) { return 'position: absolute; top: 0; left: ' + x + 'px; width: 18px; height: 560px;' + road; }));
    var houses = [];
    [62, 90, 142, 170, 198, 226, 278, 306, 332, 360].forEach(function (y) {
      [44, 140, 186, 232, 336].forEach(function (x) { houses.push('position: absolute; left: ' + (x - 13) + 'px; top: ' + (y - 9) + 'px; width: 26px; height: 18px; border-radius: 3px; background: #DAD3C6;'); });
    });
    var seq = ['no_answer', null, 'interested', 'no_answer', 'not_interested', null, 'follow_up', 'inspection_requested', 'no_answer', null, 'do_not_knock', 'existing_customer', null, 'no_answer', 'not_interested', null, 'no_answer', 'follow_up'];
    var pins = [], k = 0;
    [76, 156, 212, 292, 346].forEach(function (y) {
      [44, 140, 186, 232, 336].forEach(function (x) {
        var o = seq[k % seq.length]; k++;
        var hit = 'position: absolute; left: ' + (x - 15) + 'px; top: ' + (y - 15) + 'px; width: 30px; height: 30px; display: grid; place-items: center; text-decoration: none;';
        if (!o) { pins.push({ href: 'Record.dc.html', label: 'Not visited', mark: '', hit: hit, style: 'width: 14px; height: 14px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2.5px solid #8A847B; box-shadow: 0 1px 2px rgba(0,0,0,0.2);' }); return; }
        var d = OC[o], dnk = o === 'do_not_knock';
        pins.push({ href: dnk ? 'DoNotKnock.dc.html' : 'Record.dc.html', label: d[1], mark: d[2], hit: hit, style: 'width: 20px; height: 20px; box-sizing: border-box; border-radius: ' + (dnk ? '5px' : '50%') + '; background: ' + d[0] + '; border: 2.5px solid #FFFFFF; box-shadow: 0 2px 5px rgba(0,0,0,0.3); color: #FFFFFF; font-size: 13px; line-height: 14px; text-align: center; font-weight: 700;' });
      });
    });
    var legend = ['no_answer', 'interested', 'follow_up', 'inspection_requested', 'do_not_knock'].map(function (key) {
      var d = OC[key];
      return { label: d[1], mark: d[2], swatch: 'width: 12px; height: 12px; border-radius: ' + (key === 'do_not_knock' ? '3px' : '50%') + '; background: ' + d[0] + '; color: #FFFFFF; font-size: 10px; line-height: 12px; text-align: center; font-weight: 700;' };
    });
    legend.push({ label: 'Not visited', mark: '', swatch: 'width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 2px solid #8A847B;' });
    return {
      onBreak: b, working: !b,
      statusLabel: b ? 'ON BREAK · 0:06' : 'ON SHIFT · SINCE 8:02 AM',
      statusStyle: 'display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: ' + (b ? '#F2BE5C' : '#86D4AE') + ';',
      statusDot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + (b ? '#F2BE5C' : '#4CBF8A') + '; box-shadow: 0 0 0 3px ' + (b ? 'rgba(242,190,92,0.25)' : 'rgba(76,191,138,0.25)') + ';',
      breakLabel: b ? 'End break' : 'Break',
      breakBtn: 'min-height: 50px; padding: 0 18px; border-radius: 14px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid ' + (b ? '#F2BE5C' : 'rgba(255,255,255,0.22)') + '; background: ' + (b ? '#F2BE5C' : 'rgba(255,255,255,0.06)') + '; color: ' + (b ? '#2E1F03' : '#FFFFFF') + ';',
      toggleBreak: function () { self.setState({ onBreak: !b }); },
      gpsLabel: b ? 'Tracking paused' : 'GPS 8s ago · ±6 m',
      gpsChip: 'display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 20px; background: ' + (b ? 'rgba(242,190,92,0.12)' : 'rgba(76,191,138,0.12)') + '; border: 1px solid ' + (b ? 'rgba(242,190,92,0.3)' : 'rgba(76,191,138,0.3)') + '; color: ' + (b ? '#F2BE5C' : '#86D4AE') + ';',
      roads: roads, houses: houses, pins: pins, legend: legend
    };
  }
}
</script>
